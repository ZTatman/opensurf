name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  importer:
    name: Importer checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m py_compile scripts/import-cameras.py scripts/import-epa-beaches.py
      # Offline: never fetches camera listings or the EPA dataset.
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v

  # Deploys the build that passed both checks: main to production, pull requests to a preview URL.
  # Skipped until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets exist.
  deploy:
    name: Deploy
    needs: [app, importer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::Deploy skipped. Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable it."
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/checkout@v5
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/download-artifact@v5
        with:
          name: site
          path: dist
      - if: env.HAS_CLOUDFLARE == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Creates the Pages project on the first run; later runs reuse it.
          preCommands: npx wrangler pages project create opensurf --production-branch=main || true
          command: pages deploy dist --project-name=opensurf --branch=${{ github.head_ref || github.ref_name }}
      - if: env.HAS_CLOUDFLARE == 'true'
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
      # One preview comment per pull request, updated on each push.
      - if: env.HAS_CLOUDFLARE == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: "Preview: ${{ steps.deploy.outputs.deployment-url }} (${{ github.event.pull_request.head.sha }})"
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --edit-last --body "$BODY" \
            || gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "$BODY"
